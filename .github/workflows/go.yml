name: Go
on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:

jobs:
  golangci-lint:
    name: "GolangCI-lint"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        golang:
          - "1.26.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup asdf
        uses: asdf-vm/actions/setup@9cd779f40fe38688dd19505ccbc4eaaf018b44e7
        with:
          asdf_version: 0.16.7

      - name: Setup golang
        run: |
          asdf plugin add golang
          asdf install golang

      - name: Setup golangci-lint
        run: |
          asdf plugin add golangci-lint
          asdf install golangci-lint

      - name: Run golangci-lint
        run: make lint

  go-tests-on-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        golang:
          - "1.25.x"
          - "1.26.x"
    env:
      OS: ubuntu-latest
      GOLANG: ${{ matrix.golang }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.golang }}
      # setup-go >= v6 exports GOTOOLCHAIN=local, which breaks matrix legs
      # running a Go older than the go.mod requirement; restore the default
      # auto-switching so commands use the toolchain from go.mod.
      - name: Restore GOTOOLCHAIN auto-switching
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.golang}}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.golang}}-
      - name: Download modules
        run: go mod download
      - name: Check go.mod and go.sum
        run: |
          go mod tidy -v
          git --no-pager diff go.mod go.sum
          git --no-pager diff --quiet go.mod go.sum

      - name: Run tests without options
        run: go test ./... -v -test.timeout=20m
      - name: Run tests with race and cover
        run: SKIP_SLOW=1 go test ./... -race -covermode=atomic -coverpkg=all -coverprofile=coverage.txt -cover -v -test.timeout=20m

      # temporarily disabled, because not stable enough
      #- name: Run tests with goleak
      #  run: go test -v -tags=goleak -test.timeout=10m ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
          flags: unittests
          env_vars: OS,GOLANG
          name: codecov-umbrella
          fail_ci_if_error: false

  go-tests-on-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        golang:
          - "1.25.x"
          - "1.26.x"
    env:
      OS: macos-latest
      GOLANG: ${{ matrix.golang }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.golang }}
      # setup-go >= v6 exports GOTOOLCHAIN=local, which breaks matrix legs
      # running a Go older than the go.mod requirement; restore the default
      # auto-switching so commands use the toolchain from go.mod.
      - name: Restore GOTOOLCHAIN auto-switching
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.golang}}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.golang}}-
      - name: Download modules
        run: go mod download
      - name: Check go.mod and go.sum
        run: |
          go mod tidy -v
          git --no-pager diff go.mod go.sum
          git --no-pager diff --quiet go.mod go.sum

      - name: Run tests without options
        run: go test ./... -v -test.timeout=20m
      - name: Run tests with race and cover
        run: SKIP_SLOW=1 go test ./... -race -covermode=atomic -coverpkg=all -coverprofile=coverage.txt -cover -v -test.timeout=20m

      # temporarily disabled, because not stable enough
      #- name: Run tests with goleak
      #  run: go test -v -tags=goleak -test.timeout=10m ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
          flags: unittests
          env_vars: OS,GOLANG
          name: codecov-umbrella
          fail_ci_if_error: false
